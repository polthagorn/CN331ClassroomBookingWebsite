name: test-ci

on:
  push:
    branches: [ "testing" ]         
  pull_request:
    branches: [ "testing", "main", "master" ]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.12" ]  

    env:
      DJANGO_SETTINGS_MODULE: roombooking.settings   
      SECRET_KEY: dummy-key-for-ci
      DISABLE_COLLECTSTATIC: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "Django>=4.2,<6.0"
          fi
          pip install coverage

      - name: Show Django version
        run: python -c "import django; print('Django', django.get_version())" || true

      - name: Migrate (Django)
        if: ${{ hashFiles('manage.py') != '' }}
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run manage.py test      
          coverage report -m
          coverage xml
          coverage html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: Coverage summary (nice in UI)
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "\n\`\`\`\n$(coverage report -m)\n\`\`\`" >> $GITHUB_STEP_SUMMAR